<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#F4F5F0" />
    <title>个人中心</title>
    <script>
      (() => {
        const qq = new URLSearchParams(location.search).getAll('qq')
        const title = /^\/dashboard\/?$/.test(location.pathname) ? '个人中心' : '个人面板'
        document.title = qq.length === 1 && qq[0] === '1' ? '\u200b' : title
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>请启用 JavaScript 后访问个人面板。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
