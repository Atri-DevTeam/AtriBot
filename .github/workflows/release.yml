name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false
      draft:
        description: 'Create as draft?'
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Update version in pom.xml
      if: github.event.inputs.version != ''
      run: |
        echo "Updating version to: ${{ github.event.inputs.version }}"
        mvn versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false
    
    # 第一步：查看项目结构
    - name: Debug - List project structure
      run: |
        echo "=== Project Structure ==="
        find . -name "pom.xml" -o -name "*.java" | head -20
        echo "=== Current Directory ==="
        pwd
        ls -la
    
    # 第二步：用详细的命令构建
    - name: Build with Maven (verbose)
      run: |
        echo "=== Building with Maven ==="
        mvn clean package -DskipTests -X  # 添加-X参数显示详细日志
    
    # 第三步：查看target目录的内容
    - name: Debug - Check target directory
      run: |
        echo "=== Checking target directory ==="
        if [ -d "target" ]; then
          echo "Target directory exists"
          ls -la target/
          echo "=== Looking for JAR files ==="
          find target/ -name "*.jar" -type f
        else
          echo "ERROR: target directory does not exist!"
          echo "Maven build might have failed"
        fi
    
    # 第四步：如果找到JAR，确认路径
    - name: Debug - Verify JAR path
      run: |
        echo "=== Verifying JAR files ==="
        # 列出所有可能的JAR文件
        JAR_FILES=$(find . -name "*.jar" -type f)
        if [ -n "$JAR_FILES" ]; then
          echo "Found JAR files:"
          echo "$JAR_FILES"
          echo ""
          echo "Most likely JAR file:"
          find . -name "*.jar" -type f | grep -v ".m2/repository" | head -5
        else
          echo "No JAR files found in project"
        fi
    
    # 第五步：继续原来的发布步骤，但更安全地获取JAR文件
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version || '1.0.0' }}
        name: Release v${{ github.event.inputs.version || '1.0.0' }}
        draft: ${{ github.event.inputs.draft }}
        prerelease: ${{ github.event.inputs.prerelease }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # 第六步：修改上传步骤，处理不同的JAR文件情况
    - name: Find and Upload JAR files
      id: upload_jar
      run: |
        echo "=== Finding JAR files for upload ==="
        
        # 查找JAR文件
        JAR_FILES=$(find . -name "*.jar" -type f | grep -v ".m2/repository" || true)
        
        if [ -n "$JAR_FILES" ]; then
          echo "Found JAR files:"
          echo "$JAR_FILES"
          
          # 使用第一个找到的非依赖JAR
          MAIN_JAR=$(echo "$JAR_FILES" | head -1)
          echo "Uploading: $MAIN_JAR"
          
          # 提取文件名
          JAR_NAME=$(basename "$MAIN_JAR")
          
          # 上传到release
          curl -s \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/java-archive" \
            --data-binary @"$MAIN_JAR" \
            "${{ steps.create_release.outputs.upload_url }}?name=$JAR_NAME"
            
          echo "✓ Uploaded $JAR_NAME"
        else
          echo "⚠ No JAR files found to upload"
          exit 1
        fi
