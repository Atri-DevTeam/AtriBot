version: 2
updates:
  # Maven dependencies (Java main project)
  # Dependabot is free and does NOT consume GitHub Actions minutes.
  # Using monthly schedule to keep PR volume low and reduce any future CI cost.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # pip dependencies (Python bot)
  - package-ecosystem: "pip"
    directory: "/bot-python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
