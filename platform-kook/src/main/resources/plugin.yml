name: platform-kook
version: "1.0.0"
main: top.yzljc.atribot.plugins.kook.KookPlugin
api-version: 1
commands:
  help:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 显示帮助菜单
    usage: /help
    prefixless-aliases: [指令功能一览♪]
  hyp:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: Hypixel查询二级指令
    usage: /hyp <子命令> [参数]
    aliases:
      - hypixel
  hypstatus:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: Hypixel Server Status
    usage: /hypstatus
    aliases:
      - hs
      - hypixelstatus
      - hypixel-status
  wz:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: Hypixel法师掘战数据查询
    usage: /wz <玩家名或 UUID>
    aliases:
      - wizard
      - hypwizard
      - hypixelwizard
      - hypixel-wizard
      - wd
      - wi
    options:
      - name: player
        type: 3
        description: Minecraft 玩家名或 UUID
        required: true
  zs:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: Hypixel僵尸末日数据查询
    usage: /zs <玩家名或 UUID>
    aliases:
      - zombies
      - zombie
      - hypixelzombies
      - hypixel-zombies
      - hypzombies
    options:
      - name: player
        type: 3
        description: Minecraft 玩家名或 UUID
        required: true
  mctool:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: MC工具二级指令
    usage: /mctool <子命令> [参数]
    aliases:
      - mctools
      - minecrafttool
      - minecrafttools
      - mc
  mccape:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 查询 Minecraft 披风状态
    usage: /mccape
  mcv:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 查询最新的 Minecraft 版本
    usage: /mcv
  skbpack:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 查询 Hypixel Skyblock 资源包版本
    usage: /skbpack
  newyear:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    aliases:
      - 新年快乐
      - happynewyear
      - 新年
      - 新年倒计时
      - 过年
    description: 发送新年快乐
  hitokoto:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 随机一言
    aliases:
      - 一言
      - yiyan
    usage: /hitokoto 获取随机一言，群授权获取全部消息后可用“一言”触发
  today:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 每日日历
  mojang:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 查询Mojang服务器状态
  bantrack:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: Hypixel BanTracker
    usage: "/bantrack [时间参数]"
    aliases:
      - bt
      - bantracker
    options:
      - name: window
        type: 3
        description: 时间范围，单位为m/h/d/w/mo
        required: false
  whoami:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: 用户场景信息
  ping:
    platforms: [KOOK_CHANNEL, KOOK_DM]
    description: Pong!
    usage: /ping
