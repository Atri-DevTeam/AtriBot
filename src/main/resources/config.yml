# 指令头
command-prefix: "/"
debug-command-suffix: "--debug"

# 根目录中字体的名字
ttf-file-name: "default.ttf"

# 验证服务器Socket信息
variety-port: 8080
variety-host: "localhost"
variety-key: "public-key"

# Websocket服务器监听端口
websocket-port: "ws://localhost:1111"

# Debug 模式开关
debug-mode: false

# Minecraft服务器数据监听端口
listen-port: 25566

# HTTPS对接Napcat的上报接收端口
qq-bot-port: 1234

# Gtihub推送用Webhook端口和Secret密钥
github-webhook-port: 54321
github-webhook-secret: null

# 哔哩哔哩视频查询用的Cookie
bilibili-cookie: "null"

# 管理员QQ账号
admin-uids:
  - 3199590352

# Bot的QQ号（用来做数据排除，不填的话某些地方可能会爆炸）
bot-uid: 123456

# Debug用的QQ群号
debug-group-id: 123456

# 启用消息监听的群聊列表
message-spy-groups:
  - 123456
  - 234567

# 消息撤回监听屏蔽用户列表
recall-ignore-user:
  - 123456

# 自动点赞列表（/autolike add 会写入此处，仅群 818804507 可用）
autolike-uids: []

# Napcat HTTP 数据来源地址
# 必须是http://xxx.xxx.xxx:port格式
napcat-data-url: "http://localhost:12345"

# MYSQL数据库配置
mysql:
    host: "localhost"
    port: 3306
    database: "qq_bot"
    username: "qq_bot"
    password: "null"

# ManoDate推送群号（保密项目）
manosaba-group-id: 123456

## 关键词设置区域
# 一言
keywords-hitokoto:
    - "一言"
    - "hitokoto"
    - "yiyan"
# 点赞
keywords-like-user:
    - "点赞"
    - "likeme"
    - "zanwo"
    - "赞我"

# 雪莉叫起床的表情包在你的收藏表情中的链接（用/fetch_custom_face抓）
wakeup-image-link: "default_link"