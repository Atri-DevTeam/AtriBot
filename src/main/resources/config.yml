# ============================================================
# AtriBot 配置文件
# ============================================================

# ========== 全局设置区域 ==========

# 指令前缀，OneBot 和官方机器人通用
command-prefix: "/"
# Debug 命令后缀
debug-command-suffix: "--debug"
# 根目录中字体的文件名，默认使用自带的鸿蒙开源字体
ttf-file-name: "default.ttf"
# Debug 模式开关
debug-mode: false
# Websocket 服务器监听端口
listen-port: 1234
# API
api-url: null
# MySQL 数据库配置
mysql:
  host: "localhost"
  port: 3306
  database: "database"
  username: "root"
  password: "null"

# AI 配置（支持多提供商，按名称区分）
# 每个子节点为一个 AI 提供商。
# api-key / base-url / model / timeout 为标准字段。
# 除此之外的任意字段都会原样合并到请求 JSON body 中，
# 可用于传递 temperature、top_p、max_tokens、extra_body 等参数。
ai:
  default:
    api-key: ""
    base-url: ""
    model: "qwen3.5-flash"
    timeout: 30000000
  dickseek:
    api-key: ""
    base-url: ""
    model: "qwen3.5-flash"
    timeout: 30000000
    # 需要额外参数时直接写在下面
    # temperature: 1
    # top_p: 0.95
    # max_tokens: 16384
    # extra_body:
    #   chat_template_kwargs:
    #     thinking: false

# ========== Napcat 设置区域 ==========

napcat:
  # 是否启用 Napcat（OneBot）适配器
  enabled: false
  # Napcat HTTP 数据来源地址（消息接收入口），格式：http://xxx.xxx.xxx:port
  server-url: "http://0.0.0.0:12345"
  # Debug 用的 QQ 群号
  debug-group-uin: 123456789
  # Bot 自身的 QQ 号
  bot-uin: 123456789
  # 管理员 QQ 号列表
  admin-uins:
    - "3199590352"
  # 启用消息监听的群聊列表
  message-spy-groups:
    - "123456"
    - "234567"
  # 消息撤回监听屏蔽用户列表（仅对开启了消息监听的群有效）
  recall-ignore-user:
    - "123456"

# ========== 功能设置区域 ==========

# AtriBot Key Secret
atribot-key-secret: "null"

# Hypixel 奖励 WebSocket 地址
function:
  hypixel-reward-ws: "ws://localhost:1111"
  # SA 签到密钥
  sa-sign-key: "null"
  # GitHub Webhook 配置
  github-webhook:
    port: 54321
    secret: "null"
  # 哔哩哔哩视频查询用的 Cookie
  bilibili-cookie: "null"
  # 雪莉叫起床的表情包链接
  wakeup-image-link: "null"
  # 一言关键词
  keywords-hitokoto:
    - "一言"
    - "hitokoto"
    - "yiyan"
  # 点赞关键词
  keywords-like-user:
    - "点赞"
    - "likeme"
    - "zanwo"
    - "赞我"

# 验证服务器配置（对个人 MC 服务器使用）
verify:
  port: 8080
  host: "127.0.0.1"
  key: "public-key"

# IMAP 邮件监听配置
email:
  enabled: false
  username: ""
  password: ""
  protocol: "imap"
  host: "imap.qq.com"
  port: 993
  ssl-enabled: true
  connection-timeout: 30000
  read-timeout: 300000

# ========== 官方机器人配置参数 ==========

qq:
  # 是否启用官方机器人
  enabled: false
  # 官方的 AppID
  app-id: ""
  # 官方的密钥
  client-secret: ""
  # API 基础地址：沙箱环境用 https://sandbox.api.sgroup.qq.com，正式环境用 https://api.sgroup.qq.com
  api-base-url: "https://sandbox.api.sgroup.qq.com"
  # 官方机器人 WebUI 登录 Token（请改成足够长的随机字符串）
  official-webui-token: "null"
  # 官方机器人 OpenId
  official-openId: "null"
  # 官方机器人用户名
  official-username: "null"
  # Debug 群 OpenId
  debug-group-openId: "null"

# ========== 特殊群专用内容设置区域 ==========

# ManoDate 推送群号（保密项目）
manosaba-group-id: 123456

# 加群验证配置
group-join-verify-group-id: 123456789
group-join-verify-message: "欢迎加入，请在30秒内发送验证消息，否则将被移出群聊"
group-join-verify-timeout-seconds: 60
group-join-verify-answer: "验证"

# 官方机器人活跃消息群列表
official-active-message-groups:
  - "123456"

# 云大陆（Yunland）连接配置
yunland:
  host: "null"
  port: 12345
  connect-key: "null"
