<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>ITA · 加入群聊</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            background: #f3f7f5;
            color: #233b30;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            text-align: center;
        }
        main {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 32px 20px;
            border: 1px solid #e2ebe6;
            border-radius: 20px;
            background: #fff;
        }
        .brand { margin: 0 0 16px; color: #16864c; font-size: 14px; font-weight: 600; letter-spacing: 3px; }
        h1 { margin: 0; font-size: 26px; }
        .intro { margin: 12px 0 20px; color: #597164; font-size: 15px; }
        img { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto; -webkit-touch-callout: default; }
        .hint { margin: 20px 0 0; font-size: 16px; font-weight: 600; line-height: 1.8; }
        .note { margin: 12px 0 0; color: #68796f; font-size: 13px; line-height: 1.8; }
    </style>
</head>
<body>
<main>
    <p class="brand">ITA</p>
    <h1>加入群聊</h1>
    <p class="intro">在微信中长按下方二维码</p>
    <img src="{{QR_IMAGE}}" width="600" height="600" alt="微信群二维码，请长按识别">
    <p class="hint">选择「识别图中二维码」<br>进入微信加群页面</p>
    <p class="note">也可以使用微信「扫一扫」扫描此二维码。<br>如提示二维码已过期，请联系管理员更新。</p>
</main>
</body>
</html>
