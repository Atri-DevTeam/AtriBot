name: AtriBot
version: ${version}
main: top.yzljc.atribot.Atri

commands:
  newyear:
    aliases:
      - 新年快乐
      - happynewyear
      - 新年
      - 新年倒计时
      - 过年
    description: 发送新年快乐
  bc:
    description: 全服广播
    usage: /bc <内容>
    aliases:
      - broadcast
  golds:
    description: 查看金粒余额
    aliases:
      - 金粒
      - gold
      - coin
      - coins
  reboot:
    description: 重启Bot
    aliases:
      - restart
      - stop
  search:
    description: 搜索聊天记录
    usage: '/search "关键词" [-u QQ] [-m p/a]'
  recall:
    description: 撤回上一条消息
  rollback:
    description: 批量撤回消息
    usage: /rollback [-n 数量] [-u QQ号]
  mojang:
    description: 查询Mojang服务器状态
  cl:
    description: 领取Hypixel奖励
    usage: /cl <Hypixel每日签到链接>
  anan:
    description: 夏目安安素描本
    usage: /anan <文本> [模式]
  check-mc:
    description: 获取MC新闻
  py:
    description: 获取拼音
    aliases:
      - 拼音
      - pinyin
      - pn
  manodate:
    description: Manosaba日期查询
  github:
    description: Github相关功能
    usage: /github [on|off] 或 /github [仓库名] [群号1] [群号2]...
  signall:
    description: 自动签到
  chat:
    description: 消息统计
    usage: '/chat 查询当日发言排行信息, /chat [y | overall | @user] 查询昨日/总计/指定用户的发言统计信息'
  groupinfo:
    description: 查看群组配置
  calendar:
    description: 查看日历
  hypstatus:
    description: Hypixel Server Status
    usage: /hypstatus
    aliases:
      - hs
      - hypixelstatus
      - hypixel-status
  emj:
    description: 表情轰炸
    usage: /emj <normal/medium/insane/animation> [可选 User]
  gt:
    description: 好女孩
    usage: /gt <内容>
  autolike:
    description: 自动点赞列表
    usage: /autolike <add|remove|list> (不需要输入QQ号，非管理员不允许更改他人设置)
  verify:
    description: 验证YZ_Ljc_ Network账号
    usage: /verify <验证码>
  stats:
    description: 玩家资料查询
  rc:
    description: 服务器 RCON 控制
    aliases: [unbanme]
    usage: /rc <服务器号> <命令> - 该指令为Minecraft服务器管理使用，仅对有需求用户开放
  whoami:
    description: 我的账号信息
  mc:
    description: Minecraft相关
    usage: "/mc <子命令> [参数]"
    aliases:
      - mcv
      - skbpack
  bantrack:
    description: Hypixel BanTracker
    usage: "/bantrack [时间参数]"
    aliases:
      - bt
      - bantracker
    options:
      - name: window
        type: 3
        description: 时间范围，单位为m/h/d/w/mo
        required: false
  test:
    description: 测试命令
  feedback:
    description: 提交反馈
    usage: /feedback <反馈内容>
    aliases:
      - 反馈
      - 举报
      - 建议
  投稿:
    description: 投稿图片到图源
    usage: /投稿 [图片]
    aliases:
      - submit
      - 图源投稿
      - 上传图片
  图源:
    description: 查询图源投稿数据情况
    usage: /图源 [list]
    aliases:
      - gallery
      - 图源统计
      - 投稿统计
      - imgs
  perm:
    description: 权限管理
    aliases:
      - 权限
      - 权限管理
      - permission
  ogroup:
    description: 白名单管理
  tufe:
    description: Tufe Command
  today:
    description: 每日日历
  help:
    description: 显示帮助菜单
    usage: /help
  hitokoto:
    description: 随机一言
    aliases:
      - 一言
      - yiyan
    usage: /hitokoto 获取随机一言，群授权获取全部消息后可用“一言”触发
  minesweeper:
    description: 扫雷游戏
    aliases:
      - 扫雷
      - sl
  connect4:
    description: 四子棋游戏
    aliases:
      - 四子棋
      - c4
  sudoku:
    description: 数独游戏
    aliases:
      - 数独
      - sd
  roulette:
    description: 幸运轮盘游戏
    aliases:
      - 幸运轮盘
      - rr
  rsp:
    description: 石头剪刀布游戏
    aliases:
      - 石头剪刀布
  贡献名单:
    description: 查看贡献名单
  info:
    description: 查询账号相关字段信息
    usage: /info @<目标用户>
  webui:
    description: WebUI相关功能
    usage: /webui
  全量消息:
    description: 授权全量消息
    usage: /全量消息
  推送任务:
    description: 推送任务列表
  四子棋:
    description: 四子棋游戏
    aliases:
      - c4
      - connect4
      - connectfour
  打卡:
    description: 每日打卡签到
    usage: /打卡
  debug:
    description: 调试
  check-hyp:
    description: 检查Hypixel最新公告
  games:
    aliases:
      - 游戏
      - 小游戏
      - game
    description: 小游戏
  music:
    description: Music
    usage: /music <关键词>
  ping:
    description: Pong!
    usage: /ping
  boop:
    description: Boop!
    usage: /boop @<目标用户>
    aliases:
      - boo
  update:
    description: 设置更新推送内容
    usage: /updatepush <set|clear|status> <内容>
    aliases:
      - 更新推送
      - 更新通知
  spc:
    description: 特殊指令集
    usage: 取决于 label
    aliases:
      - yl
  check-mojira:
    description: 检查 Mojira 漏洞追踪器
  test-mcnews:
    description: 测试获取 MC 新闻
  check-hyp-alpha:
    description: 检查 Hypixel Alpha 测试服最新公告
  pause:
    description: 紧急暂停
  地球online:
    description: 地球在线
    usage: /地球online
    aliases:
      - 地球在线
      - earthonline
      - eo
      - earth
      - online
      - 地球
  随机物品:
    description: 抽取Minecraft物品卡
    usage: /随机物品 [bag]
    aliases:
      - 随机物品
      - 随机物品卡
      - mcitem
      - mcitemcard
      - loot
  recovergolds:
    description: 补发金粒
    usage: /recovergolds
    aliases:
      - recovermcbind
      - recoverjoin
      - recoverbefriend
      - recoverguild
  refresh:
    description: 刷新全部官方机器人端群资料
    usage: /refresh
  test-markdown:
    description: 测试Markdown渲染
    usage: /test-markdown
  ua:
    description: 统一身份验证
    usage: /ua
  wizard:
    description: Hypixel法师掘战数据查询
    usage: /wizard
    aliases:
      - hypwizard
      - hypixelwizard
      - hypixel-wizard
      - wd
      - wi
      - wz
  zombies:
    description: Hypixel僵尸末日数据查询
    usage: /zombies
    aliases:
      - zombie
      - zs
      - hypixelzombies
      - hypixel-zombies
      - hypzombies
  time:
    description: 查询指定国家/地区的当前时间，不带参数默认查询北京时间
    usage: /time <国家代称/中文名/城市名/时区ID>
    aliases:
      - 时区
      - timezone
      - tz
      - 世界时间
      - 当前时间
    options:
      - name: zone
        type: 3
        description: 地区
        required: false

  hyp:
    description: Hypixel查询二级指令
    usage: /hyp <子命令> [参数]
    aliases:
      - hypixel
  mctool:
    description: Mc工具二级指令
    usage: /mctool <子命令> [参数]
    aliases:
      - mctools
      - minecrafttool
      - minecrafttools
# TUFE 系列专用查询指令
  查询帮助:
    description: 查询 Tufe 系列相关指令帮助信息
    usage: /查询帮助
  绑定:
    description: 绑定 Tufe 系列账号
    usage: /绑定
  宿舍电表:
    description: 查询宿舍电表信息
    usage: /宿舍电表
  空调电表:
    description: 查询空调电表信息
    usage: /空调电表
