<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      QQ 的 multimedia CDN 拒绝带 referrer 的请求，图片是靠 referrerpolicy="no-referrer"
      逐个规避的；但 <video> 没有这个属性（HTML 规范只给了 img/iframe/link/script/a），
      只能在页面级声明。后端不校验 Referer、鉴权走 same-origin cookie，去掉它没有副作用。
    -->
    <meta name="referrer" content="no-referrer" />
    <link id="webui-favicon" rel="icon" type="image/svg+xml" href="/webui/assets/bot-blue-DZrZgVc9.svg" />
    <title>AtriBot WebUI</title>
    <style>
      #webui-startup { min-height: 100dvh; display: grid; place-content: center; gap: 14px; padding: 24px; background: #f7f8fa; color: #5c6573; text-align: center; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif }
      #webui-startup p { margin: 0 }
      #webui-startup a { color: #0099ff; margin: 0 10px }
      #webui-startup [hidden] { display: none }
    </style>
    <script type="module" crossorigin src="/webui/assets/index-C6pk0lqq.js"></script>
    <link rel="stylesheet" crossorigin href="/webui/assets/index-BvO1Rq_2.css">
  </head>
  <body>
    <div id="app">
      <div id="webui-startup" role="status">
        <p id="webui-startup-message">正在加载管理界面…</p>
        <p id="webui-startup-actions" hidden><a href="">重新加载</a><a href="/dashboard/">返回工作台</a></p>
        <noscript>请启用 JavaScript 后重新加载</noscript>
      </div>
    </div>
    <script>
      (() => {
        const qq = new URLSearchParams(location.search).getAll('qq')
        if (qq.length === 1 && qq[0] === '1') {
          document.documentElement.classList.add('qq-page')
          document.title = '\u200b'
          document.querySelector('#webui-startup-actions a[href="/dashboard/"]').href = '/dashboard/?qq=1'
        }
        function failed() {
          const message = document.getElementById('webui-startup-message')
          if (!message) return
          message.textContent = '页面资源加载失败，请重新加载'
          document.getElementById('webui-startup-actions').hidden = false
        }
        window.addEventListener('webui:startup-error', failed)
        window.addEventListener('vite:preloadError', failed)
        window.addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement) failed()
        }, true)
      })()
    </script>
  </body>
</html>
